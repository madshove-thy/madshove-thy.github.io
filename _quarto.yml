# Quarto project configuration for madshove-thy.github.io
project:
  type: website
  output-dir: _site
  # Only the listed pages are built. research.qmd and blog/ are kept in the
  # repository but excluded from the site; to bring either back, drop the
  # exclusion below and re-add its navbar entry.
  render:
    - "*.qmd"
    - "!research.qmd"
    - "!blog/"

website:
  title: "Mads Fuglsang Hove"
  description: "Assistant Professor of Political Science at Aarhus University, studying how digital media affects contemporary democracy."
  site-url: "https://madshove-thy.github.io"
  favicon: images/favicon.png
  # Open Graph / Twitter cards so shared links look right on Bluesky, LinkedIn, etc.
  open-graph: true
  twitter-card: true

  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: About
      - href: publications.qmd
        text: Publications
      - href: teaching.qmd
        text: Teaching
      - href: office-hours.qmd
        text: Office hours
      - href: media.qmd
        text: Media & outreach
    right:
      - icon: envelope
        href: mailto:madshove@ps.au.dk
        aria-label: Email
      - text: "Bluesky"
        href: https://bsky.app/profile/madshovethy.bsky.social
        aria-label: Bluesky
      - icon: linkedin
        href: https://www.linkedin.com/in/mads-hove-0b5337112/
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/madshove-thy
        aria-label: GitHub

  page-footer:
    left: "&copy; 2026 Mads Fuglsang Hove"
    right: "[madshove@ps.au.dk](mailto:madshove@ps.au.dk)"

format:
  html:
    theme: styles.scss
    toc: false
    anchor-sections: false
    link-external-newwindow: true
